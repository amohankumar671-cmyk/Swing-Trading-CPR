[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpr-scanner"
version = "0.1.0"
description = "CPR Multi-Timeframe Swing Scanner for NSE F&O stocks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools]
py-modules = [
  "config",
  "cpr",
  "indicators",
  "signals",
  "entry_status",
  "risk",
  "evaluate",
  "scanner",
  "data",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
